<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ZANTHOS</title>
  <style>
    /* ─────────────────────────────────────────────────────────────
       ZANTHOS 官方设计语言（token 内联照抄自运营站 /product-design.css）
       静态站不能外链隧道内 CSS，故把 --z-* 变量内联，保持零外部依赖。
       来源注释：product-design.css「shared by workstation, portal and phone web」
       ───────────────────────────────────────────────────────────── */
    :root{
      color-scheme:dark;
      --z-space-2:8px;--z-space-3:12px;--z-space-4:16px;--z-space-5:24px;--z-space-6:32px;
      --z-radius-sm:10px;--z-radius-md:14px;--z-radius-xl:26px;
      --z-surface-0:#070b13;--z-surface-1:#0d1523;--z-surface-2:#121d2e;--z-surface-3:#19273d;
      --z-line:#2a3a54;--z-line-strong:#3d5578;
      --z-text:#f2f6fc;--z-text-2:#bdc9da;--z-text-3:#8fa0b8;
      --z-brand:#79aefe;--z-brand-strong:#3d7ee7;--z-brand-soft:#1d3152;
      --z-shadow-lg:0 24px 70px #0008;
      --z-focus:0 0 0 3px color-mix(in srgb,var(--z-brand) 28%,transparent);
      --z-ease:cubic-bezier(.2,.8,.2,1);
    }
    @media (prefers-color-scheme:light){
      :root{
        color-scheme:light;
        --z-surface-0:#f3f6fa;--z-surface-1:#ffffff;--z-surface-2:#ffffff;--z-surface-3:#edf2f8;
        --z-line:#d3dce8;--z-line-strong:#b6c4d7;
        --z-text:#172337;--z-text-2:#52637a;--z-text-3:#6f8095;
        --z-brand:#245fc6;--z-brand-strong:#2864cf;--z-brand-soft:#e4edfc;
        --z-shadow-lg:0 26px 70px #1d36522b;
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100dvh;
      /* 与运营站登录页 .auth-page 同一背景配方 */
      background:
        radial-gradient(circle at 18% 12%,#1a477957,transparent 33%),
        radial-gradient(circle at 85% 88%,#5a2d7450,transparent 32%),
        var(--z-surface-0);
      color:var(--z-text);
      font:15px/1.6 Inter,"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,-apple-system,sans-serif;
      display:grid;place-items:center;padding:var(--z-space-5);
    }
    /* 与 .auth-page>main 同一卡片规格 */
    main{
      width:min(440px,100%);padding:var(--z-space-6);
      border:1px solid var(--z-line-strong);border-radius:var(--z-radius-xl);
      background:color-mix(in srgb,var(--z-surface-1) 96%,transparent);
      box-shadow:var(--z-shadow-lg);
    }
    header{display:flex;justify-content:space-between;align-items:center;gap:var(--z-space-4)}
    .brand{font-size:13px;letter-spacing:.12em;color:var(--z-text)}
    select{
      width:auto;padding:var(--z-space-2) 11px;margin:0;
      border:1px solid var(--z-line);border-radius:var(--z-radius-sm);
      background:var(--z-surface-1);color:var(--z-text);font:inherit;font-size:13px;
      transition:border-color 120ms var(--z-ease);
    }
    select:hover{border-color:var(--z-line-strong)}
    select:focus-visible,button:focus-visible{outline:2px solid var(--z-brand);outline-offset:2px;box-shadow:var(--z-focus)}
    h1{font-size:28px;margin:var(--z-space-5) 0 var(--z-space-2);font-weight:750;letter-spacing:-.018em}
    p{color:var(--z-text-2);margin:0}
    .status{display:flex;align-items:center;gap:10px;margin-top:var(--z-space-5);color:var(--z-text-2);font-size:14px}
    .spinner{
      width:18px;height:18px;flex:0 0 auto;border-radius:50%;
      border:2px solid var(--z-line);border-top-color:var(--z-brand);
      animation:z-spin .8s linear infinite;
    }
    @keyframes z-spin{to{transform:rotate(360deg)}}
    .dest{
      margin:10px 0 0;font-size:12.5px;color:var(--z-text-3);word-break:break-all;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    /* 与官方 .primary 同规格：渐变蓝 + 白色字 + 品牌描边 */
    button{
      width:100%;margin-top:var(--z-space-5);padding:13px 14px;
      border:1px solid #70a4f2;border-radius:var(--z-radius-sm);
      font:inherit;font-weight:650;cursor:pointer;min-height:44px;
      background:linear-gradient(180deg,#397be5,#2864cf);color:#fff;
      box-shadow:0 7px 18px #124aa23d;
      transition:filter 120ms var(--z-ease),transform 120ms var(--z-ease);
    }
    button:hover{filter:brightness(1.08)}
    button:active{transform:translateY(1px)}
    .foot{margin:var(--z-space-4) 0 0;font-size:12.5px;color:var(--z-text-3);line-height:1.6}
    .hidden{display:none}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}button{transition:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <span class="brand">ZANTHOS</span>
      <select id="lang" aria-label="界面语言">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </header>

    <h1 id="title">正在进入运营站</h1>
    <p id="intro">正在为你跳转，请稍候…</p>

    <div class="status">
      <span class="spinner"></span>
      <span id="statusText">正在连接…</span>
    </div>
    <p class="dest hidden" id="dest"></p>

    <button id="goBtn">立即进入</button>

    <p class="foot" id="foot">固定入口会自动跟随服务器地址变化，只需收藏这一个网址。</p>
  </main>

  <script>
    // 回退目标：current-url.json 拉取失败时使用（此值随每次推送自动更新）
    var FALLBACK = "https://sells-abilities-cove-obvious.trycloudflare.com";
    // GitHub Pages 项目页基础路径：跳转时需剥离，避免把 /zanthos-sz 带到隧道上
    var BASE = "/zanthos-sz";
    var target = FALLBACK, redirected = false;

    var copy = {
      zh:     { t:'正在进入运营站', i:'正在为你跳转，请稍候…', b:'立即进入', conn:'正在连接…', f:'固定入口会自动跟随服务器地址变化，只需收藏这一个网址。' },
      'zh-TW':{ t:'正在進入營運站', i:'正在為你跳轉，請稍候…', b:'立即進入', conn:'正在連線…', f:'固定入口會自動跟隨伺服器位址變化，只需收藏這一個網址。' },
      vi:     { t:'Đang vào trạm vận hành', i:'Đang chuyển hướng, vui lòng chờ…', b:'Vào ngay', conn:'Đang kết nối…', f:'Cổng cố định tự cập nhật theo địa chỉ máy chủ, bạn chỉ cần lưu một liên kết này.' },
      en:     { t:'Opening the workstation', i:'Redirecting, please wait…', b:'Enter now', conn:'Connecting…', f:'This fixed entry follows server address changes automatically — bookmark just this one link.' }
    };

    function normalize(x){
      x = String(x || '').toLowerCase();
      if (['zh-tw','zh-hk','zh-mo'].indexOf(x) >= 0) return 'zh-TW';
      if (x.indexOf('vi') === 0) return 'vi';
      if (x.indexOf('en') === 0) return 'en';
      return 'zh';
    }

    function apply(value){
      var l = normalize(value), c = copy[l];
      document.documentElement.lang = (l === 'zh-TW') ? 'zh-TW' : l;
      document.getElementById('title').textContent = c.t;
      document.getElementById('intro').textContent = c.i;
      document.getElementById('goBtn').textContent = c.b;
      document.getElementById('foot').textContent = c.f;
      if (!redirected) document.getElementById('statusText').textContent = c.conn;
      document.getElementById('lang').value = l;
      try { localStorage.setItem('zanthos-redirect-language', l); } catch (e) {}
      return l;
    }

    try { apply(localStorage.getItem('zanthos-redirect-language') || navigator.language); }
    catch (e) { apply(navigator.language); }
    document.getElementById('lang').onchange = function (e) { apply(e.target.value); };

    // 目标 = 隧道地址 + （剥离项目基础路径后的）子路径，保持深链可用
    function dest() {
      var p = location.pathname || '/';
      if (p.indexOf(BASE) === 0) p = p.slice(BASE.length);
      if (!p) p = '/';
      return target + p + location.search + location.hash;
    }
    function go() { redirected = true; window.location.replace(dest()); }
    document.getElementById('goBtn').onclick = go;

    // 读取当前隧道地址（由深圳端自动化在域名变化时自动更新）
    try {
      fetch('current-url.json?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.url) {
            target = d.url;
            var el = document.getElementById('dest');
            el.textContent = String(d.url).replace(/^https?:\/\//, '');
            el.classList.remove('hidden');
            setTimeout(go, 800);
          } else { setTimeout(go, 300); }
        })
        .catch(function () { setTimeout(go, 300); });
    } catch (e) { setTimeout(go, 300); }

    // 兜底：4 秒后无论如何跳走
    setTimeout(function () { if (!redirected) go(); }, 4000);
  </script>
<!-- mobile deep-link entry --></body>
</html>
