<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ZANTHOS</title>
  <style>
    /* ─────────────────────────────────────────────────────────────
       ZANTHOS 官方设计语言（token 内联照抄自运营站 /product-design.css）
       静态站不能外链隧道内 CSS，故把 --z-* 变量内联，保持零外部依赖。
       ───────────────────────────────────────────────────────────── */
    :root{
      color-scheme:dark;
      --z-space-2:8px;--z-space-3:12px;--z-space-4:16px;--z-space-5:24px;--z-space-6:32px;
      --z-radius-sm:10px;--z-radius-md:14px;--z-radius-xl:26px;
      --z-surface-0:#070b13;--z-surface-1:#0d1523;--z-surface-2:#121d2e;--z-surface-3:#19273d;
      --z-line:#2a3a54;--z-line-strong:#3d5578;
      --z-text:#f2f6fc;--z-text-2:#bdc9da;--z-text-3:#8fa0b8;
      --z-brand:#79aefe;--z-brand-strong:#3d7ee7;--z-brand-soft:#1d3152;
      --z-shadow-lg:0 24px 70px #0008;
      --z-focus:0 0 0 3px color-mix(in srgb,var(--z-brand) 28%,transparent);
      --z-ease:cubic-bezier(.2,.8,.2,1);
    }
    @media (prefers-color-scheme:light){
      :root{
        color-scheme:light;
        --z-surface-0:#f3f6fa;--z-surface-1:#ffffff;--z-surface-2:#ffffff;--z-surface-3:#edf2f8;
        --z-line:#d3dce8;--z-line-strong:#b6c4d7;
        --z-text:#172337;--z-text-2:#52637a;--z-text-3:#6f8095;
        --z-brand:#245fc6;--z-brand-strong:#2864cf;--z-brand-soft:#e4edfc;
        --z-shadow-lg:0 26px 70px #1d36522b;
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100dvh;
      background:
        radial-gradient(circle at 18% 12%,#1a477957,transparent 33%),
        radial-gradient(circle at 85% 88%,#5a2d7450,transparent 32%),
        var(--z-surface-0);
      color:var(--z-text);
      font:15px/1.6 Inter,"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,-apple-system,sans-serif;
      display:grid;place-items:center;padding:var(--z-space-5);
    }
    main{
      width:min(470px,100%);padding:var(--z-space-6);
      border:1px solid var(--z-line-strong);border-radius:var(--z-radius-xl);
      background:color-mix(in srgb,var(--z-surface-1) 96%,transparent);
      box-shadow:var(--z-shadow-lg);
    }
    header{display:flex;justify-content:space-between;align-items:center;gap:var(--z-space-4)}
    .brand{font-size:13px;letter-spacing:.12em;color:var(--z-text)}
    select{
      width:auto;max-width:150px;padding:var(--z-space-2) 11px;margin:0;
      border:1px solid var(--z-line);border-radius:var(--z-radius-sm);
      background:var(--z-surface-1);color:var(--z-text);font:inherit;font-size:13px;
      transition:border-color 120ms var(--z-ease);
    }
    select:hover{border-color:var(--z-line-strong)}
    h1{font-size:26px;margin:var(--z-space-5) 0 var(--z-space-2);font-weight:750;letter-spacing:-.018em}
    p{color:var(--z-text-2);margin:0}
    .entries{display:grid;gap:var(--z-space-3);margin-top:var(--z-space-5)}
    .entry{
      display:flex;align-items:center;gap:var(--z-space-3);
      padding:var(--z-space-4);border:1px solid var(--z-line);border-radius:var(--z-radius-md);
      background:var(--z-surface-2);
    }
    .entry .icon{
      width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
      border:1px solid var(--z-line);border-radius:var(--z-radius-sm);
      background:var(--z-surface-1);color:var(--z-brand);font-size:18px;
    }
    .entry .meta{min-width:0;flex:1}
    .entry .meta b{display:block;font-weight:650;color:var(--z-text)}
    .entry .meta span{display:block;font-size:12.5px;color:var(--z-text-3);word-break:break-all}
    .entry button{
      flex:0 0 auto;min-height:40px;padding:0 var(--z-space-4);
      border:1px solid #70a4f2;border-radius:var(--z-radius-sm);
      background:linear-gradient(180deg,#397be5,#2864cf);color:#fff;
      font:inherit;font-weight:650;cursor:pointer;box-shadow:0 7px 18px #124aa23d;
      transition:filter 120ms var(--z-ease);
    }
    .entry button:hover:not(:disabled){filter:brightness(1.08)}
    .entry button:disabled{opacity:.5;cursor:not-allowed}
    .entry.server button{
      border:1px solid var(--z-line-strong);background:var(--z-surface-3);color:var(--z-text);box-shadow:none;
    }
    .status{display:flex;align-items:center;gap:10px;margin-top:var(--z-space-4);color:var(--z-text-2);font-size:13px}
    .spinner{
      width:16px;height:16px;flex:0 0 auto;border-radius:50%;
      border:2px solid var(--z-line);border-top-color:var(--z-brand);animation:z-spin .8s linear infinite;
    }
    @keyframes z-spin{to{transform:rotate(360deg)}}
    .foot{margin:var(--z-space-4) 0 0;font-size:12.5px;color:var(--z-text-3);line-height:1.6}
    select:focus-visible,button:focus-visible{outline:2px solid var(--z-brand);outline-offset:2px;box-shadow:var(--z-focus)}
    @media (max-width:420px){
      .entry{flex-wrap:wrap}
      .entry button{width:100%}
    }
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}button,select{transition:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <span class="brand">ZANTHOS</span>
      <select id="lang" aria-label="界面语言">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </header>

    <h1 id="title">选择入口</h1>
    <p id="intro">客户端用于日常使用；服务器端用于运维管理。</p>

    <div class="entries">
      <div class="entry client">
        <div class="icon">▤</div>
        <div class="meta">
          <b id="clientLabel">客户端</b>
          <span id="clientHost">解析中…</span>
        </div>
        <button id="clientBtn" disabled>进入</button>
      </div>
      <div class="entry server">
        <div class="icon">⚙</div>
        <div class="meta">
          <b id="serverLabel">服务器端</b>
          <span id="serverHost">解析中…</span>
        </div>
        <button id="serverBtn" disabled>进入</button>
      </div>
    </div>

    <div class="status"><span class="spinner"></span><span id="statusText">正在获取当前地址…</span></div>

    <p class="foot" id="foot">两个入口共用一个固定网址，会自动跟随服务器地址变化，只需收藏本页。</p>
  </main>

  <script>
    // 回退目标：current-url.json 拉取失败时使用（此值随每次推送自动更新）
    var FALLBACK = "https://decided-verse-terrorist-phillips.trycloudflare.com";
    // 客户端入口（业务层已为 /client 加保持鉴权的 303 → /portal.html）
    var CLIENT_PATH = "/client";
    // 服务器端入口（反代层 /server* 重写到业务层根路径 = 服务器端控制台）
    var SERVER_PATH = "/server";
    var base = FALLBACK, ready = false;

    var copy = {
      zh:     { t:'选择入口', i:'客户端用于日常使用；服务器端用于运维管理。', c:'客户端', s:'服务器端', b:'进入', wait:'正在获取当前地址…', ok:'地址就绪，请选择入口。', f:'两个入口共用一个固定网址，会自动跟随服务器地址变化，只需收藏本页。' },
      'zh-TW':{ t:'選擇入口', i:'客戶端用於日常使用；伺服器端用於維運管理。', c:'客戶端', s:'伺服器端', b:'進入', wait:'正在取得目前位址…', ok:'位址就緒，請選擇入口。', f:'兩個入口共用一個固定網址，會自動跟隨伺服器位址變化，只需收藏本頁。' },
      vi:     { t:'Chọn cổng vào', i:'Bản khách hàng dùng hằng ngày; bản máy chủ dùng để vận hành.', c:'Bản khách hàng', s:'Bản máy chủ', b:'Vào', wait:'Đang lấy địa chỉ hiện tại…', ok:'Đã có địa chỉ, hãy chọn cổng vào.', f:'Hai cổng vào dùng chung một liên kết cố định, tự cập nhật theo địa chỉ máy chủ.' },
      en:     { t:'Choose an entry', i:'Client for daily use; server for operations.', c:'Client', s:'Server', b:'Enter', wait:'Resolving the current address…', ok:'Address ready — choose an entry.', f:'Both entries share one fixed link that follows server address changes automatically.' }
    };

    function normalize(x){
      x = String(x || '').toLowerCase();
      if (['zh-tw','zh-hk','zh-mo'].indexOf(x) >= 0) return 'zh-TW';
      if (x.indexOf('vi') === 0) return 'vi';
      if (x.indexOf('en') === 0) return 'en';
      return 'zh';
    }

    function apply(value){
      var l = normalize(value), c = copy[l];
      document.documentElement.lang = (l === 'zh-TW') ? 'zh-TW' : l;
      document.getElementById('title').textContent = c.t;
      document.getElementById('intro').textContent = c.i;
      document.getElementById('clientLabel').textContent = c.c;
      document.getElementById('serverLabel').textContent = c.s;
      document.getElementById('clientBtn').textContent = c.b;
      document.getElementById('serverBtn').textContent = c.b;
      document.getElementById('foot').textContent = c.f;
      if (!ready) document.getElementById('statusText').textContent = c.wait;
      document.getElementById('lang').value = l;
      try { localStorage.setItem('zanthos-redirect-language', l); } catch (e) {}
      return l;
    }

    function hostOf(){ return String(base).replace(/^https?:\/\//, '').replace(/\/+$/, ''); }

    function go(path){ window.location.replace(base + path); }

    document.getElementById('clientBtn').onclick = function(){ if (ready) go(CLIENT_PATH); };
    document.getElementById('serverBtn').onclick = function(){ if (ready) go(SERVER_PATH); };

    try { apply(localStorage.getItem('zanthos-redirect-language') || navigator.language); }
    catch (e) { apply(navigator.language); }
    document.getElementById('lang').onchange = function (e) { apply(e.target.value); };

    function readyUp(){
      ready = true;
      document.getElementById('clientHost').textContent = hostOf() + CLIENT_PATH;
      document.getElementById('serverHost').textContent = hostOf() + SERVER_PATH;
      document.getElementById('clientBtn').disabled = false;
      document.getElementById('serverBtn').disabled = false;
      var l = 'zh';
      try { l = normalize(localStorage.getItem('zanthos-redirect-language') || navigator.language); } catch (e) {}
      document.getElementById('statusText').textContent = copy[l].ok;
    }

    // 读取当前隧道地址（由深圳端自动化在域名变化时自动更新）
    try {
      fetch('current-url.json?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.url) base = String(d.url).replace(/\/+$/, ''); readyUp(); })
        .catch(readyUp);
    } catch (e) { readyUp(); }
  </script>
</body>
</html>
